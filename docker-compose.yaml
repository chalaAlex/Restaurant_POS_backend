version: "3.9"

services:
  api:
    build: .
    container_name: restaurant-api

    ports:
      - "3000:3000"

    env_file:
      - .env.development

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

    depends_on:
      - mongodb

    restart: unless-stopped

  mongodb:
    image: mongo:8

    container_name: restaurant-mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped

volumes:
  mongodb_data: